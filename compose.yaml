name: options-learning-kb

# Application services only. Shared PostgreSQL + pgvector and Ollama remain
# owned and started by cs-ai-lab-infra.
services:
  operator-ui:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OPTIONS_KB_STREAMLIT_PORT: "8501"
    ports:
      - "${OPTIONS_KB_STREAMLIT_BIND_ADDRESS:-127.0.0.1}:${OPTIONS_KB_STREAMLIT_PORT:-8502}:8501"
    networks:
      - t480_internal

  retrieval-api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "options_learning_kb.api:app", "--host", "0.0.0.0", "--port", "8080"]
    expose:
      - "8080"
    networks:
      - t480_internal

networks:
  t480_internal:
    external: true
    name: ${T480_DOCKER_NETWORK:-cs-ai-lab_internal}
